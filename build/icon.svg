<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">WhizMD</title>
  <desc id="desc">A rounded document outline interrupted by the letters MD.</desc>
  <defs>
    <mask id="md-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white" />
      <rect x="111" y="144" width="127" height="92" rx="16" fill="black" />
    </mask>
  </defs>

  <rect width="256" height="256" rx="52" fill="#f7f9fc" />
  <rect x="30" y="30" width="196" height="196" rx="42" fill="#e8f3ff" />
  <rect x="30" y="30" width="196" height="196" rx="42" fill="none" stroke="#1f6feb" stroke-width="18" mask="url(#md-cutout)" />
  <text x="128" y="116" text-anchor="middle" fill="#5ba7e8" font-family="Brush Script MT, Segoe Script, URW Chancery L, cursive" font-size="54" font-style="italic" font-weight="600" letter-spacing="0">Whiz</text>
  <text x="226" y="226" text-anchor="end" fill="#1f6feb" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-6">MD</text>
</svg>
